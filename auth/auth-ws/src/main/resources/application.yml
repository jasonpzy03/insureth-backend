spring:
  application:
    name: auth
  artemis:
    broker-url: tcp://${ACTIVEMQ_HOST:localhost}:61616
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}

security:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldi1vbmx5LWluc3VyZXRoLWJhY2tvZmZpY2Utand0LXNlY3JldC1rZXktMDE=}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}

auth:
  siwe:
    client-portal:
      domain: ${CLIENT_PORTAL_SIWE_DOMAIN:localhost:4200}
      uri: ${CLIENT_PORTAL_SIWE_URI:http://localhost:4200}
      statement: ${CLIENT_PORTAL_SIWE_STATEMENT:Sign in to Insureth Client Portal}
      chain-id: ${CLIENT_PORTAL_SIWE_CHAIN_ID:31337}
    backoffice:
      domain: ${BACKOFFICE_SIWE_DOMAIN:localhost:4300}
      uri: ${BACKOFFICE_SIWE_URI:http://localhost:4300}
      statement: ${BACKOFFICE_SIWE_STATEMENT:Sign in to Insureth Back Office}
      chain-id: ${BACKOFFICE_SIWE_CHAIN_ID:31337}

logging:
  level:
    org:
      springframework:
        web: DEBUG
        security: DEBUG

internal:
  api:
    key: ${INTERNAL_API_KEY:insureth-internal-dev-key}

server:
  port: 8081
