services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  activemq:
    image: apache/activemq-artemis:latest
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    environment:
      ARTEMIS_USER: ${ACTIVEMQ_USER}
      ARTEMIS_PASSWORD: ${ACTIVEMQ_PASSWORD}

  auth-service:
    build:
      context: .
      dockerfile: ./auth/auth-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started

  insurance-service:
    build:
      context: .
      dockerfile: ./insurance/insurance-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      auth-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: ./notification/notification-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started

  gateway-service:
    build: ../insureth-frontend/gateway
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      auth-service:
        condition: service_started
      insurance-service:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  postgres-data:
