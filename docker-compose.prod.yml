services:
  activemq:
    image: apache/activemq-artemis:latest
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    environment:
      ARTEMIS_USER: ${ACTIVEMQ_USER}
      ARTEMIS_PASSWORD: ${ACTIVEMQ_PASSWORD}

  auth-service:
    build:
      context: .
      dockerfile: ./auth/auth-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      activemq:
        condition: service_started

  insurance-service:
    build:
      context: .
      dockerfile: ./insurance/insurance-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      activemq:
        condition: service_started
      auth-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: ./notification/notification-ws/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      activemq:
        condition: service_started

  gateway-service:
    image: insureth-frontend-gateway-service:latest
    build: ../insureth-frontend/gateway
    restart: unless-stopped
    env_file:
      - ./deploy/backend.env
    depends_on:
      auth-service:
        condition: service_started
      insurance-service:
        condition: service_started
    ports:
      - "8080:8080"
